<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sin Conexión - BEA ERP</title>
  <style>
    :root {
      --bg-gradient-start: #0a0f1d;
      --bg-gradient-end: #070a13;
      --card-bg: rgba(255, 255, 255, 0.03);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-primary: #ffffff;
      --text-secondary: #94a3b8;
      --accent-color: #0ea5e9;
      --accent-hover: #38bdf8;
      --accent-glow: rgba(14, 165, 233, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end));
      color: var(--text-primary);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .container {
      max-width: 480px;
      width: 90%;
      padding: 40px;
      border-radius: 24px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      text-align: center;
      animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .icon-wrapper {
      margin-bottom: 24px;
      position: relative;
      display: inline-block;
    }

    .pulse-ring {
      position: absolute;
      top: -10px;
      left: -10px;
      width: 100px;
      height: 100px;
      border: 2px solid var(--accent-color);
      border-radius: 50%;
      animation: pulse 2.5s infinite;
      opacity: 0.6;
    }

    .icon-circle {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, rgba(14, 165, 233, 0.1), rgba(14, 165, 233, 0.02));
      border: 1px solid rgba(14, 165, 233, 0.3);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0 auto;
    }

    .icon-circle svg {
      width: 38px;
      height: 38px;
      fill: none;
      stroke: var(--accent-color);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      animation: float 4s ease-in-out infinite;
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 12px;
      letter-spacing: -0.5px;
      background: linear-gradient(to right, #ffffff, #e2e8f0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      color: var(--text-secondary);
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 32px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: #f59e0b;
      border-radius: 50%;
      animation: blink 1.5s infinite;
    }

    .btn-retry {
      display: inline-block;
      width: 100%;
      padding: 14px 28px;
      background: linear-gradient(135deg, var(--accent-color), #0369a1);
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 4px 15px var(--accent-glow);
    }

    .btn-retry:hover {
      background: linear-gradient(135deg, var(--accent-hover), var(--accent-color));
      transform: translateY(-2px);
      box-shadow: 0 8px 25px var(--accent-glow);
    }

    .btn-retry:active {
      transform: translateY(0);
    }

    .footer {
      margin-top: 32px;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.2);
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulse {
      0% {
        transform: scale(0.85);
        opacity: 0.8;
      }
      70% {
        transform: scale(1.2);
        opacity: 0;
      }
      100% {
        transform: scale(1.2);
        opacity: 0;
      }
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-6px);
      }
    }

    @keyframes blink {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon-wrapper">
      <div class="pulse-ring"></div>
      <div class="icon-circle">
        <!-- Icono de Wifi Off SVG -->
        <svg viewBox="0 0 24 24">
          <line x1="1" y1="1" x2="23" y2="23"></line>
          <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.5"></path>
          <path d="M5 12.5a10.94 10.94 0 0 1 5.83-2.84"></path>
          <path d="M12 18.5a3 3 0 0 1-2.17-1.19"></path>
          <path d="M16.1 5.9A15.82 15.82 0 0 1 19 7.5"></path>
          <path d="M5 7.5a15.82 15.82 0 0 1 8.92-2.37"></path>
        </svg>
      </div>
    </div>

    <h1>Sin Conexión a Internet</h1>
    <p>BEA ERP necesita una conexión activa para comunicarse con la base de datos en la nube. Por favor, verifica tu red Wi-Fi o cable de red local.</p>

    <div class="status-badge">
      <span class="status-dot"></span>
      <span id="status-text">Intentando reconectar automáticamente...</span>
    </div>

    <button class="btn-retry" id="retry-btn">Reintentar Conexión</button>

    <div class="footer">
      BEA ERP v1.0.0 • Bioelectrónica Honduras
    </div>
  </div>

  <script>
    const retryBtn = document.getElementById('retry-btn');
    const statusText = document.getElementById('status-text');
    const ERP_URL = 'https://sistema.bioelectronicahn.com/login';

    // Función para verificar la conexión
    async function checkConnection() {
      try {
        // Hacemos una petición rápida a un endpoint público o archivo favicon del ERP para validar internet y que el servidor responda
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 4000); // 4 segundos de timeout

        const response = await fetch(ERP_URL + '/favicon.ico', { 
          mode: 'no-cors', 
          cache: 'no-store',
          signal: controller.signal 
        });
        
        clearTimeout(timeoutId);
        
        // Si no hay error en fetch, significa que hay internet y responde el host
        statusText.innerText = "¡Conexión recuperada! Recargando...";
        statusText.style.color = "#10b981";
        const dot = document.querySelector('.status-dot');
        if (dot) dot.style.backgroundColor = "#10b981";
        
        setTimeout(() => {
          window.location.href = ERP_URL;
        }, 1000);
      } catch (error) {
        console.log("Aún sin conexión a Internet:", error);
      }
    }

    // Event listener en el botón manual
    retryBtn.addEventListener('click', () => {
      statusText.innerText = "Verificando conexión...";
      checkConnection();
    });

    // Monitoreo automático cada 5 segundos
    setInterval(checkConnection, 5000);

    // Monitoreo nativo del navegador para reconexión instantánea
    window.addEventListener('online', () => {
      statusText.innerText = "Detectada conexión a Internet. Recargando...";
      checkConnection();
    });
  </script>
</body>
</html>
